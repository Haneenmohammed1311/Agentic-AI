[project]
name = "langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Haneen Mohammed", email = "haneeenmohammid@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "black>=26.5.1",
    "deepagents>=0.7.13",
    "isort>=9.0.1",
    "langchain>=1.4.0",
    "langchain-google-genai>=4.4.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langchain-tavily>=0.2.18",
    "langsmith>=0.12.2",
    "python-dotenv>=1.2.3",
    "schema>=0.7.8",
    "tavily>=1.1.0",
    "tavily-python>=0.8.2",
]

[project.scripts]
langchain-course = "langchain_course:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
